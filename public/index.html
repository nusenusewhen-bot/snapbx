<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LTC Transaction Tool</title>
    <style>
        body { background: #0a0a0a; color: #00ff88; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #111; padding: 40px; border-radius: 8px; border: 1px solid #00ff88; width: 400px; }
        input { width: 100%; background: #000; border: 1px solid #00ff88; color: #00ff88; padding: 10px; margin: 10px 0; font-family: monospace; }
        button { width: 100%; background: #00ff88; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc66; }
        #result { margin-top: 20px; word-break: break-all; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>LTC Flash Sender</h2>
        <input type="text" id="addr" placeholder="Target LTC Address (e.g., L...)">
        <input type="number" id="amt" placeholder="Amount (e.g., 5.5)" step="0.001">
        <button onclick="send()">INITIATE</button>
        <div id="result"></div>
    </div>
    <script>
        const API = "https://your-railway-app.up.railway.app/flash";
        async function send() {
            const addr = document.getElementById('addr').value;
            const amt = parseFloat(document.getElementById('amt').value);
            document.getElementById('result').innerHTML = "Broadcasting...";
            try {
                const r = await fetch(API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({address: addr, amount: amt})
                });
                const j = await r.json();
                document.getElementById('result').innerHTML = 
                    `<b>TXID:</b> ${j.txid}<br><b>Hex:</b> ${j.hex}<br><b>Status:</b> ${JSON.stringify(j.broadcast_attempts)}`;
            } catch(e) {
                document.getElementById('result').innerHTML = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
